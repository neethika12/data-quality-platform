version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data_quality.db
      - DEBUG=True
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./data_quality.db:/app/data_quality.db
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dq-network

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: dq-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-react/src:/app/src
    depends_on:
      - backend
    networks:
      - dq-network

networks:
  dq-network:
    driver: bridge
